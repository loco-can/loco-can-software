; Loco-CAN firmware — PlatformIO environments
;
; Arduino IDE users keep selecting the module in hardware.h.
; PlatformIO sets PIOENV + MODULE + *_MODULE_VERSION so one tree can
; build every supported board without editing that file.
;
; Protocol IDs match https://github.com/loco-can/LocoCAN

[platformio]
src_dir = .
default_envs = programmer_v3
data_dir = src/module/programmer/data
description = Loco-CAN module firmware

[extra]
build_src_filter =
	+<src/**>
	-<doc/**>
	-<license/**>
	-<host/**>

[firmware]
framework = arduino
monitor_speed = 115200
build_src_filter = ${extra.build_src_filter}
build_flags =
	-D PIOENV
	-I.

; ---------------------------------------------------------------------------
; ESP32-S3 programmer — OLED + encoder + WiFi Platform UI (LittleFS)
; ---------------------------------------------------------------------------
[env:programmer_v3]
extends = firmware
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
	extra_scripts = scripts/pio_littlefs_namelen.py
build_flags =
	${firmware.build_flags}
	-D MODULE=PROGRAMMER_MODULE
	-D PROGRAMMER_MODULE_VERSION=V_3_0

; ---------------------------------------------------------------------------
; ESP32-S3 WIFI — CAN + ESP-NOW wireless bridge
; ---------------------------------------------------------------------------
[env:wifi_v3]
extends = firmware
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
build_flags =
	${firmware.build_flags}
	-D MODULE=WIFI_MODULE
	-D WIFI_MODULE_VERSION=V_3_0

; ---------------------------------------------------------------------------
; ESP32-S3 controller (debug / V3 hardware)
; ---------------------------------------------------------------------------
[env:controller_v3]
extends = firmware
platform = atmelavr
board = nanoatmega328
build_flags =
	${firmware.build_flags}
	-D MODULE=CONTROLLER_MODULE
	-D CONTROLLER_MODULE_VERSION=V_3_0

; ---------------------------------------------------------------------------
; ATmega328P modules (garden-railway V2.x boards, Nano-compatible)
;
; FTDI: monitor talks to the sketch (115200), upload talks to the bootloader.
; Optiboot / Arduino IDE "Nano" uses 115200. Old Nano bootloader is 57600 —
; set board = nanoatmega328 if avrdude still cannot sync.
; Auto-reset needs FTDI DTR → RESET (usually via 100 nF). Close the serial
; monitor before upload. monitor_dtr/rts = 0 so the monitor does not hold RESET.
; ---------------------------------------------------------------------------
[avr]
extends = firmware
platform = atmelavr
board = nanoatmega328new
upload_protocol = arduino
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:controller_v21]
extends = avr
build_flags =
	${firmware.build_flags}
	-D MODULE=CONTROLLER_MODULE
	-D CONTROLLER_MODULE_VERSION=V_2_1

[env:controller_v20]
extends = avr
build_flags =
	${firmware.build_flags}
	-D MODULE=CONTROLLER_MODULE
	-D CONTROLLER_MODULE_VERSION=V_2_0

[env:electric_v21]
extends = avr
build_flags =
	${firmware.build_flags}
	-D MODULE=ELECTRIC_MODULE
	-D ELECTRIC_MODULE_VERSION=V_2_1

[env:switch_v21]
extends = avr
build_flags =
	${firmware.build_flags}
	-D MODULE=SWITCH_MODULE
	-D SWITCH_MODULE_VERSION=V_2_1

[env:sensor_v21]
extends = avr
build_flags =
	${firmware.build_flags}
	-D MODULE=SENSOR_MODULE
	-D SENSOR_MODULE_VERSION=V_2_1

[env:servo_v21]
extends = avr
build_flags =
	${firmware.build_flags}
	-D MODULE=SERVO_MODULE
	-D SERVO_MODULE_VERSION=V_2_1

; ---------------------------------------------------------------------------
; Host-side protocol check (no Arduino, no hardware)
; Confirms can_protocol.h stays include-able by PC / Platform UI tools,
; matching the loco-can/LocoCAN library IDs.
; ---------------------------------------------------------------------------
[env:protocol_host]
platform = native
build_src_filter =
	+<host/**>
	+<src/module/controller/status.cpp>
	+<src/module/controller/params.cpp>
	+<src/module/electric/plugin.cpp>
	+<src/module/electric/settings.cpp>
	+<src/module/electric/sensors.cpp>
	+<src/module/switch/function.cpp>
	+<src/module/switch/params.cpp>
	+<src/module/switch/current.cpp>
	+<src/module/servo/mapping.cpp>
	+<src/module/servo/params.cpp>
build_flags =
	-std=c++17
	-I.
	-Isrc
